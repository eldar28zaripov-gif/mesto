<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Mesto</title>
  <link rel="stylesheet" href="pages/index.css">
</head>
<body class="page">
<div class="page__content">
  <header class="header page__section">
    <img src="images/logo.svg" alt="Логотип проекта масто" class="logo header__logo">
  </header>
  <main class="content">
    <section class="profile page__section">
      <div class="profile__image"></div>
      <div class="profile__info">
        <h1 class="profile__title"></h1>
        <button class="profile__edit-button" type="button"></button>
        <p class="profile__description"></p>
      </div>
      <button class="profile__stats-button" type="button" aria-label="Открыть статистику">i</button>
      <button class="profile__add-button" type="button"></button>
    </section>

    <section class="places page__section">
      <ul class="places__list">
      </ul>
    </section>
  </main>
  <footer class="footer page__section">
    <p class="footer__copyright">
      © 2021 Mesto Russia
    </p>
  </footer>
  <div class="popup popup_type_edit">
    <div class="popup__content">
      <button type="button" class="popup__close"></button>
      <h3 class="popup__title">Редактировать профиль</h3>
      <form class="popup__form" name="edit-profile" novalidate>
        <input id="profile-name-input" type="text" name="name" class="popup__input popup__input_type_name" placeholder="Имя" minlength="2" maxlength="40" pattern="^[A-Za-zА-Яа-яЁё\- ]+$" required>
        <span id="profile-name-input-error" class="popup__error"></span>
        <input id="profile-description-input" type="text" name="description" class="popup__input popup__input_type_description" placeholder="Занятие" minlength="2" maxlength="200" required>
        <span id="profile-description-input-error" class="popup__error"></span>
        <button type="submit" class="button popup__button popup__button_disabled" disabled>Сохранить</button>
      </form>
    </div>
  </div>

  <div class="popup popup_type_new-card">
    <div class="popup__content">
      <button type="button" class="popup__close"></button>
      <h3 class="popup__title">Новое место</h3>
      <form class="popup__form" name="new-place" novalidate>
        <input id="card-title-input" type="text" name="place-name" class="popup__input popup__input_type_card-name" placeholder="Название" minlength="2" maxlength="30" pattern="^[A-Za-zА-Яа-яЁё\- ]+$" required>
        <span id="card-title-input-error" class="popup__error"></span>
        <input id="card-link-input" type="url" name="link" class="popup__input popup__input_type_url" placeholder="Ссылка на картинку" required>
        <span id="card-link-input-error" class="popup__error"></span>
        <button type="submit" class="button popup__button popup__button_disabled" disabled>Создать</button>
      </form>
    </div>
  </div>

  <div class="popup popup_type_avatar">
    <div class="popup__content">
      <button type="button" class="popup__close"></button>
      <h3 class="popup__title">Обновить аватар</h3>
      <form class="popup__form" name="edit-avatar" novalidate>
        <input id="avatar-link-input" type="url" name="avatar" class="popup__input popup__input_type_avatar-url" placeholder="Ссылка на аватар" required>
        <span id="avatar-link-input-error" class="popup__error"></span>
        <button type="submit" class="button popup__button popup__button_disabled" disabled>Сохранить</button>
      </form>
    </div>
  </div>
  <div class="popup popup_type_image">
    <div class="popup__content popup__content_content_image">
      <button type="button" class="popup__close"></button>
      <img src="" alt="" class="popup__image">
      <p class="popup__caption"></p>
    </div>
  </div>

  <div class="popup popup_type_stats">
    <div class="popup__content popup__content_type_stats">
      <button type="button" class="popup__close"></button>
      <h3 class="popup__title">Статистика пользователей</h3>

      <section class="popup__stats">
        <div class="popup__stats-row">
          <span class="popup__stats-term">Всего карточек:</span>
          <span class="popup__stats-value" data-stat="total-cards">0</span>
        </div>
        <div class="popup__stats-row">
          <span class="popup__stats-term">Первая создана:</span>
          <span class="popup__stats-value" data-stat="first-created">-</span>
        </div>
        <div class="popup__stats-row">
          <span class="popup__stats-term">Последняя создана:</span>
          <span class="popup__stats-value" data-stat="last-created">-</span>
        </div>
        <div class="popup__stats-row">
          <span class="popup__stats-term">Всего пользователей:</span>
          <span class="popup__stats-value" data-stat="total-users">0</span>
        </div>
        <div class="popup__stats-row">
          <span class="popup__stats-term">Максимум карточек от одного:</span>
          <span class="popup__stats-value" data-stat="max-cards">0</span>
        </div>
      </section>

      <h4 class="popup__stats-subtitle">Все пользователи:</h4>
      <ul class="popup__stats-users" data-stat="users-list"></ul>
    </div>
  </div>
</div>
<script type="module" src="src/scripts/index.js"></script>
<template class="template">
  <li class="places__item card">
    <img class="card__image" alt="">
    <button type="button" class="card__delete-button"></button>
    <div class="card__description">
      <h2 class="card__title">
      </h2>
      <div class="card__like-container">
        <button type="button" class="card__like-button"></button>
        <span class="card__like-count">0</span>
      </div>
    </div>
  </li>
</template>

</body>
</html>
